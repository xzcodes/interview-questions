64465><div style="position:relative;" class="vp-doc _interview-questions_js_event" data-v-65164465><div><h1 id="事件冒泡和事件捕获" tabindex="-1">事件冒泡和事件捕获 <a class="header-anchor" href="#事件冒泡和事件捕获" aria-label="Permalink to &quot;事件冒泡和事件捕获&quot;">​</a></h1><h3 id="问题" tabindex="-1">问题： <a class="header-anchor" href="#问题" aria-label="Permalink to &quot;问题：&quot;">​</a></h3><p>什么是事件冒泡和事件捕获，它们的区别是什么？</p><h3 id="答案" tabindex="-1">答案： <a class="header-anchor" href="#答案" aria-label="Permalink to &quot;答案：&quot;">​</a></h3><p>事件冒泡和事件捕获是两种事件传播的方式。</p><p>事件冒泡：事件从目标元素开始，逐级向上传播到文档对象。</p><p>事件捕获：事件从文档对象开始，逐级向下传播到目标元素。</p><p>可以通过 addEventListener 的第三个参数来控制事件的传播方式。</p></div></div></main><footer class="VPDocFooter" data-v-65164465 data-v-e569ee29><!--[--><!--]--><div class="edit-info" data-v-e569ee29><!----><div class="last-updated" data-v-e569ee29><p class="VPLastUpdated" data-v-e569ee29 data-v-1b1acb2c>Last updated: <time datetime="2025-11-16T07:17:53.000Z" data-v-1b1acb2c></time></p></div></div><nav class="prev-next" aria-labelledby="doc-footer-aria-label" data-v-e569ee29><span class="visually-hidden" id="doc-footer-aria-label" data-v-e569ee29>Pager</span><div class="pager" data-v-e569ee29><a class="VPLink link pager-link prev" href="/interview-questions/js/closure.html" data-v-e569ee29><!--[--><span class="desc" data-v-e569ee29>上一页</span><span class="title" data-v-e569ee29>什么是闭包</span><!--]--></a></div><div class="pager" data-v-e569ee29><!----></div></nav></footer><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>
